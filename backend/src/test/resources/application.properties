# Test Application Properties
jwt.secret=test-secret-key-for-devflow-unit-and-integration-tests-minimum-256-bits!
jwt.expiration=3600000

# Actuator Endpoints Configuration
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
management.info.env.enabled=true

# Application Metadata for /actuator/info
info.app.name=DevFlow Backend
info.app.description=DevFlow Project and Issue Management Platform
info.app.version=0.0.1-SNAPSHOT
info.app.java.version=21

# Logging & Request Correlation
logging.pattern.correlation=[${spring.application.name:},%X{requestId:-}] 
