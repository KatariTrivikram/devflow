# Dedicated Integration Test Profile Properties
spring.application.name=devflow-test

# JPA / Hibernate for Integration Testing with PostgreSQL Testcontainers
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Flyway Schema Migrations
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Security Configuration
jwt.secret=test-secret-key-for-devflow-unit-and-integration-tests-minimum-256-bits!
jwt.expiration=3600000

# Management / Actuator Configuration for Integration Tests
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
management.info.env.enabled=true

# Application Metadata for /actuator/info
info.app.name=DevFlow Backend (Test)
info.app.description=DevFlow Project and Issue Management Platform
info.app.version=0.0.1-SNAPSHOT
info.app.java.version=21

# Logging & Request Correlation
logging.pattern.correlation=[${spring.application.name:},%X{requestId:-}] 
