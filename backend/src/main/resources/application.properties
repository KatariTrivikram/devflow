# DevFlow Application Properties
spring.application.name=devflow

# Server Configuration
server.port=${PORT:${SERVER_PORT:8080}}
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s

# Database Configuration
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=${SHOW_SQL:false}

# Flyway Schema Migrations
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Security Configuration
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:3600000}
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://localhost:80}

# Springdoc OpenAPI & Swagger UI Configuration
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui/index.html
springdoc.swagger-ui.operations-sorter=alpha
springdoc.swagger-ui.tags-sorter=alpha

# Actuator Endpoints Configuration
# Expose only health and info endpoints publicly for container probes & operational status
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
management.info.env.enabled=false

# Application Metadata for /actuator/info (no secrets or infrastructure details)
info.app.name=DevFlow Backend
info.app.description=DevFlow Project and Issue Management Platform
info.app.version=0.0.1-SNAPSHOT
info.app.java.version=21

# Logging & Request Correlation
logging.pattern.correlation=[${spring.application.name:},%X{requestId:-}] 


